- type: entity
  parent: BaseAction
  id: ActionSummonCheese
  name: Summon Cheese
  description: Places a slice of cheese in your hand. delicious!
  components:
  - type: Magic
    requiresClothes: false
  - type: Action
    useDelay: 1
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Consumable/Food/ingredients.rsi
      state: cheesewedge
  - type: InstantAction
    event: !type:SpawnItemInHandEvent
      spawned: FoodCheeseSlice
      castSound: !type:SoundCollectionSpecifier
        collection: MagicRetroCantrip

- type: entity
  parent: BaseAction
  id: ActionSummonDuck
  name: Summon Duck
  description: -NR-Summon one ordinary duck nearby.
  components:
  - type: Magic
    requiresClothes: false
  - type: Action
    useDelay: 1
    itemIconStyle: BigAction
    icon:
      sprite: Mobs/Animals/duck.rsi
      state: duck-0
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: MobDuckMallard
      castSound: !type:SoundCollectionSpecifier
        collection: MagicRetroCantrip

- type: entity
  parent: BaseAction
  id: ActionSummonBee
  name: Summon Bee
  description: -NR-Summon one non-hostile bee nearby.
  components:
  - type: Magic
    requiresClothes: false
  - type: Action
    useDelay: 1
    itemIconStyle: BigAction
    icon:
      sprite: Mobs/Animals/bee.rsi
      state: 0
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: MobBee
      castSound: !type:SoundCollectionSpecifier
        collection: MagicRetroCantrip

- type: entity
  parent: BaseAction
  id: ActionSummonBeer
  name: Magical Ale
  description: A conjured bottle of booze, glows slightly when shaken.
  components:
  - type: Magic
    requiresClothes: false
  - type: Action
    useDelay: 1
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Consumable/Drinks/pwinebottle.rsi
      state: icon
  - type: InstantAction
    event: !type:SpawnItemInHandEvent
      spawned: DrinkMagicalAleBottle
      castSound: !type:SoundCollectionSpecifier
        collection: MagicRetroCantrip

- type: entity
  parent: ActionCantripMessage
  id: ActionWizardTelepathy
  name: Telepathy
  description: "Telapathically send a message directly to someone's mind. Range: 4"
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 1
  - type: TargetAction
    range: 4

- type: entity
  parent: BaseAction
  id: ActionWizardMinorIllusion
  name: Minor Illusion
  description: "Conjure an Illusionary image of a random creature. Range: 4"
  components:
  - type: Magic
    requiresClothes: false
  - type: Action
    useDelay: 1
    itemIconStyle: BigAction
    icon: { sprite: Mobs/Animals/mouse.rsi, state: mouse-0 }
  - type: TargetAction
    range: 4
  - type: WorldTargetAction
    event: !type:MinorIllusionSpellEvent

- type: entity
  parent: BaseAction
  id: ActionWizardSpeakWithDead
  name: Speak with Dead
  description: Hear nearby ghosts for 30 seconds. Can be canceled at any time.
  components:
  - type: Magic
    requiresClothes: false
    requiresSpeech: true
  - type: Action
    itemIconStyle: BigAction
    icon: { sprite: Mobs/Ghosts/ghost_human.rsi, state: animated }
  - type: InstantAction
    event: !type:SpeakWithDeadSpellEvent

- type: entity
  parent: BaseAction
  id: ActionWizardMageHand
  name: Mage Hand
  description: Control an ethereal hand that can interact with nearby objects.
  components:
  - type: Magic
    requiresClothes: false
  - type: Action
    itemIconStyle: BigAction
    icon: { sprite: _ST/Effects/interaction.rsi, state: hand }
  - type: InstantAction
    event: !type:ToggleMageHandSpellEvent
  - type: SpeakOnAction
    sentence: action-speech-spell-wizard-undecided
    tts: action-speech-spell-wizard-undecided
    modifier: Spell

- type: entity
  parent: BaseAction
  id: ActionWizardMageHandReturn
  name: -NR-Return from Mage Hand
  description: -NR-Release the flying hand and return to your body.
  components:
  - type: WizardFullSizeIcon
  - type: Action
    itemIconStyle: BigAction
    icon: { sprite: _ST/Effects/interaction.rsi, state: hand }
  - type: InstantAction
    event: !type:ReturnMageHandSpellEvent

- type: entity
  parent: BaseAction
  id: ActionWizardArcaneChalk
  name: Arcane Chalk
  description: Summon magical chalk, writes on anything, about anything!
  components:
  - type: Magic
    requiresClothes: false
  - type: Action
    useDelay: 1
    itemIconStyle: BigAction
    icon: { sprite: Objects/Fun/crayons.rsi, state: white }
  - type: InstantAction
    event: !type:ArcaneChalkSpellEvent
  - type: SpeakOnAction
    sentence: action-speech-spell-wizard-undecided
    tts: action-speech-spell-wizard-undecided
    modifier: Spell

- type: entity
  parent: BaseAction
  id: ActionRandomizeLanguages
  name: Language Shift
  description: You ever heard of the Tower of Babel?
  components:
  - type: Magic
    requiresClothes: true
    requiresSpeech: true
  - type: Action
    useDelay: 3600 # full hour use delay. you get ONE mabey TWO on beta.
    itemIconStyle: BigAction
    icon:
      sprite: _Starlight/Interface/Actions/actions_wizard.rsi
      state: babel_spell
  - type: SpeakOnAction
    sentence: action-speech-spell-babel
    tts: action-speech-spell-babel-tts
    modifier: Spell
  - type: InstantAction
    event: !type:TowerOfBabelEvent
  - type: EorgPreventAction

- type: entity
  parent: BaseAction
  id: ActionRetractableItemManaBlade
  name: Manifest Spectral Blade
  description: Channel your power into your hand and create a sword out of hardened mana.
  components:
    - type: Action
      useDelay: 2
      raiseOnAction: true
      itemIconStyle: BigAction
      icon:
        sprite: _Starlight/Objects/Weapons/Melee/Mana_Blade.rsi
        state: icon
      sound: !type:SoundPathSpecifier
        path: /Audio/Magic/staff_healing.ogg
    - type: InstantAction
      event: !type:OnRetractableItemActionEvent
    - type: RetractableItemAction
      spawnedPrototype: ManaBlade
      #summonSounds:
       # collection: gib # Placeholder
      #retractSounds:
       # collection: gib # Placeholder
    #Starlight edit: changeling action costs
